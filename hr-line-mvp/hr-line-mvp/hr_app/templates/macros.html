{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'person' %}<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
{% elif name == 'wallet' %}<path d="M4 6h15v14H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h13v2"/><path d="M19 11h-5v5h5"/><path d="M16 13.5h.1"/>
{% elif name == 'book' %}<path d="M12 5v16M3 4c4-1 6 0 9 1 3-1 5-2 9-1v15c-4-1-6 0-9 2-3-2-5-3-9-2Z"/>
{% elif name == 'message' %}<path d="M21 12a9 9 0 0 1-9 9 10 10 0 0 1-4-1l-5 1 1-5a10 10 0 0 1-1-4 9 9 0 0 1 18 0Z"/><path d="M8 9h8M8 13h5"/>
{% elif name == 'shield' %}<path d="m12 2 8 4v6c0 5-5 8-8 10-3-2-8-5-8-10V6Z"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'headset' %}<path d="M4 14v-3a8 8 0 0 1 16 0v6c0 3-2 4-5 4"/><rect x="2" y="11" width="4" height="7" rx="2"/><rect x="18" y="11" width="4" height="7" rx="2"/><path d="M12 21h3"/>
{% elif name == 'folder' %}<path d="M3 6h7l2 3h9v12H3Z"/><path d="M3 6V3h7l2 3h8v3"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'lock' %}<rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/>
{% elif name == 'home' %}<path d="m2 10 10-8 10 8M5 8v13h14V8M10 21v-7h4v7"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% endif %}</svg>
{%- endmacro %}

{% macro csrf() -%}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{%- endmacro %}

{% macro badge(status) -%}<span class="status {{ status|status_class }}"><span></span>{{ status }}</span>{%- endmacro %}

{% macro field_error(field, errors) -%}{% if errors.get(field) %}<p class="field-error" id="error-{{ field }}">{{ errors[field] }}</p>{% endif %}{%- endmacro %}
