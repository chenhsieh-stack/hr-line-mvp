<script>
var BASE_URL = '<?= baseUrl ?>';

(function(){
  var params = new URLSearchParams(location.search);
  var pg = params.get('page') || 'home';
  document.querySelectorAll('.desktop-nav a, .mobile-nav a').forEach(function(a){
    a.classList.toggle('active', a.dataset.page === pg);
  });

  // Allow Enter key
  document.getElementById('empIdInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') loadCases();
  });
})();

var KINDS = {feedback: '意見反映', complaint: '安心申訴', human: '真人HR'};

function statusClass(s){
  if(s === '新案件') return 'new';
  if(s === '處理中') return 'working';
  if(s === '待員工回覆') return 'waiting';
  if(s === '已結案') return 'closed';
  return 'new';
}

function formatTime(v){
  if(!v) return '—';
  try {
    var d = new Date(v);
    if(isNaN(d.getTime())) return String(v);
    return d.getFullYear() + '-' +
      ('0'+(d.getMonth()+1)).slice(-2) + '-' +
      ('0'+d.getDate()).slice(-2) + ' ' +
      ('0'+d.getHours()).slice(-2) + ':' +
      ('0'+d.getMinutes()).slice(-2);
  } catch(e){ return String(v); }
}

function loadCases(){
  var empId = document.getElementById('empIdInput').value.trim();
  var alertArea = document.getElementById('alertArea');
  var casesArea = document.getElementById('casesArea');
  var statusGuide = document.getElementById('statusGuide');
  var btn = document.getElementById('searchBtn');

  if(!empId){
    alertArea.innerHTML = '<div class="alert error" role="alert">請輸入員工編號</div>';
    return;
  }

  alertArea.innerHTML = '';
  casesArea.innerHTML = '<div class="empty-state initial-state"><p style="color:var(--muted);font-size:13px;">載入中…</p></div>';
  btn.disabled = true;
  btn.textContent = '查詢中…';
  statusGuide.hidden = true;

  google.script.run
    .withSuccessHandler(function(result){
      btn.disabled = false;
      btn.textContent = '查詢';
      if(!result.ok){
        alertArea.innerHTML = '<div class="alert error" role="alert">' + (result.error || '查詢失敗') + '</div>';
        casesArea.innerHTML = '';
        return;
      }
      var cases = result.cases || [];
      if(cases.length === 0){
        casesArea.innerHTML = '<div class="empty-state"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3Z"/><path d="M3 6V3h7l2 3h8v3"/></svg><h2>目前沒有案件</h2><p>此員工編號尚未有送出的案件記錄</p><a href="' + BASE_URL + '?page=form&kind=human" class="button dark">立即提交案件</a></div>';
        return;
      }
      statusGuide.hidden = false;
      var html = '<div style="margin-top:24px;">';
      cases.forEach(function(c){
        var kindLabel = KINDS[c.kind] || c.kind || '—';
        var sc = statusClass(c.status);
        var sensitive = c.sensitive === '1' || c.sensitive === 1;
        html += '<div class="employee-case">';
        html += '<div class="service-icon sage" style="height:43px;width:43px;flex-shrink:0;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3Z"/><path d="M3 6V3h7l2 3h8v3"/></svg></div>';
        html += '<div class="employee-case-content">';
        html += '<span class="case-number">' + (c.caseNumber || '—') + '</span>';
        if(sensitive) html += '<span class="manual-label">人工受理</span>';
        html += '<h2>' + (c.title || '（無主旨）') + '</h2>';
        html += '<p>' + kindLabel + '<span>' + (c.category || '—') + '</span><span>' + formatTime(c.createdAt) + '</span></p>';
        html += '</div>';
        html += '<span class="status ' + sc + '"><span></span>' + (c.status || '新案件') + '</span>';
        html += '</div>';
      });
      html += '</div>';
      casesArea.innerHTML = html;
    })
    .withFailureHandler(function(err){
      btn.disabled = false;
      btn.textContent = '查詢';
      alertArea.innerHTML = '<div class="alert error" role="alert">系統錯誤：' + err.message + '</div>';
      casesArea.innerHTML = '';
    })
    .getMyCases(empId);
}
</script>
