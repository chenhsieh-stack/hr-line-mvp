<script>
(function(){
  // Active nav
  var params = new URLSearchParams(location.search);
  var pg = params.get('page') || 'home';
  var kind = params.get('kind') || '';
  var navKey = pg;
  if(pg === 'form') {
    if(kind === 'complaint') navKey = 'form-complaint';
    else if(kind === 'human') navKey = 'form-human';
    else navKey = 'form';
  }
  document.querySelectorAll('.desktop-nav a, .mobile-nav a').forEach(function(a){
    a.classList.toggle('active', a.dataset.page === navKey);
  });

  // Submit button disable on form submit
  document.addEventListener('submit', function(e){
    var form = e.target;
    var btn = form.querySelector('button[type=submit]');
    if(btn && !btn.dataset.noDisable){
      btn.disabled = true;
      btn.textContent = '送出中…';
    }
  });

  // Copy button
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-copy]');
    if(!btn) return;
    var text = btn.dataset.copy;
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        var orig = btn.textContent;
        btn.textContent = '已複製！';
        setTimeout(function(){ btn.textContent = orig; }, 1800);
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      var orig = btn.textContent;
      btn.textContent = '已複製！';
      setTimeout(function(){ btn.textContent = orig; }, 1800);
    }
  });
})();
</script>
