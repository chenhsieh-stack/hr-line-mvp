<script>
var BASE_URL = '<?= baseUrl ?>';
var currentPage = 1;
var currentFilters = {};

function handleLogout(){
  sessionStorage.removeItem('adminToken');
  window.location.href = BASE_URL + '?page=login';
}

function statusClass(s){
  if(s === '新案件') return 'new';
  if(s === '處理中') return 'working';
  if(s === '待員工回覆') return 'waiting';
  if(s === '已結案') return 'closed';
  return 'new';
}

var KINDS = {feedback: '意見反映', complaint: '安心申訴', human: '真人HR'};

function formatTime(v){
  if(!v) return '—';
  try {
    var d = new Date(v);
    if(isNaN(d.getTime())) return String(v);
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' +
      ('0'+d.getDate()).slice(-2) + ' ' +
      ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  } catch(e){ return String(v); }
}

function applyFilters(){
  currentPage = 1;
  currentFilters = {
    q: document.getElementById('filterQ').value.trim(),
    status: document.getElementById('filterStatus').value,
    category: document.getElementById('filterCategory').value
  };
  loadCases();
}

function resetFilters(){
  document.getElementById('filterQ').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterCategory').value = '';
  currentFilters = {};
  currentPage = 1;
  loadCases();
}

function goPage(p){
  currentPage = p;
  loadCases();
}

function loadCases(){
  var token = sessionStorage.getItem('adminToken');
  if(!token){ window.location.href = BASE_URL + '?page=login'; return; }

  var filters = {};
  for(var k in currentFilters) filters[k] = currentFilters[k];
  filters.page = currentPage;

  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state" style="border:0;padding:30px;"><p>載入中…</p></div></td></tr>';

  google.script.run
    .withSuccessHandler(function(result){
      if(!result.ok){
        if(result.error && result.error.indexOf('登入') >= 0){
          window.location.href = BASE_URL + '?page=login';
          return;
        }
        document.getElementById('alertArea').innerHTML = '<div class="alert error">' + (result.error || '載入失敗') + '</div>';
        return;
      }

      var stats = result.stats || {};
      document.getElementById('statNew').textContent = stats['新案件'] !== undefined ? stats['新案件'] : 0;
      document.getElementById('statWorking').textContent = stats['處理中'] !== undefined ? stats['處理中'] : 0;
      document.getElementById('statWaiting').textContent = stats['待員工回覆'] !== undefined ? stats['待員工回覆'] : 0;
      document.getElementById('statClosed').textContent = stats['已結案'] !== undefined ? stats['已結案'] : 0;

      document.getElementById('tableCaption').textContent = '案件列表（共 ' + result.total + ' 筆）';
      document.getElementById('tableMeta').textContent = '第 ' + result.page + ' / ' + result.totalPages + ' 頁';

      var cases = result.cases || [];
      if(cases.length === 0){
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state" style="border:0;padding:45px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v12H3Z"/><path d="M3 6V3h7l2 3h8v3"/></svg><h2>沒有案件</h2><p>目前沒有符合條件的案件</p></div></td></tr>';
      } else {
        var html = '';
        cases.forEach(function(c){
          var sc = statusClass(c.status);
          var kindLabel = KINDS[c.kind] || c.kind || '—';
          var sensitive = c.sensitive === '1' || c.sensitive === 1;
          html += '<tr>';
          html += '<td><strong>' + (c.caseNumber || '—') + '</strong>';
          if(sensitive) html += '<br><span class="manual-label">人工受理</span>';
          html += '</td>';
          html += '<td>' + kindLabel + '</td>';
          html += '<td><strong>' + escHtml(c.title || '（無主旨）') + '</strong><small>' + escHtml(c.category || '—') + '</small></td>';
          html += '<td>' + escHtml(c.name || '—') + '<small>' + escHtml(c.employeeId || '') + '</small></td>';
          html += '<td class="org-cell">' + escHtml(c.organization || '—') + '</td>';
          html += '<td><span class="status ' + sc + '"><span></span>' + escHtml(c.status || '新案件') + '</span></td>';
          html += '<td>' + formatTime(c.createdAt) + '</td>';
          html += '<td><a class="inline-link" href="' + BASE_URL + '?page=admin-case&number=' + encodeURIComponent(c.caseNumber || '') + '">查看<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a></td>';
          html += '</tr>';
        });
        tbody.innerHTML = html;
      }

      var pagArea = document.getElementById('paginationArea');
      if(result.totalPages <= 1){
        pagArea.innerHTML = '';
      } else {
        var pagHtml = '';
        if(result.page > 1) pagHtml += '<button class="button secondary" onclick="goPage(' + (result.page-1) + ')">← 上一頁</button>';
        pagHtml += '<span>第 ' + result.page + ' 頁 / 共 ' + result.totalPages + ' 頁</span>';
        if(result.page < result.totalPages) pagHtml += '<button class="button secondary" onclick="goPage(' + (result.page+1) + ')">下一頁 →</button>';
        pagArea.innerHTML = pagHtml;
      }
    })
    .withFailureHandler(function(err){
      document.getElementById('alertArea').innerHTML = '<div class="alert error">系統錯誤：' + err.message + '</div>';
    })
    .getAllCases(token, filters);
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

(function(){
  var token = sessionStorage.getItem('adminToken');
  if(!token){ window.location.href = BASE_URL + '?page=login'; return; }
  document.getElementById('filterQ').addEventListener('keydown', function(e){
    if(e.key === 'Enter') applyFilters();
  });
  loadCases();
})();
</script>
