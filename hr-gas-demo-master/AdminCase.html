          <input type="text" id="updateAssignee" placeholder="HR 負責人員姓名">

          <label for="updateCategory">類別調整<span class="optional">選填</span></label>

<script>
var BASE_URL = '<?= baseUrl ?>';
var CASE_NUMBER = '';

function handleLogout(){
  sessionStorage.removeItem('adminToken');
  window.location.href = BASE_URL + '?page=login';
}

var KINDS = {feedback: '意見反映', complaint: '安心申訴', human: '真人HR'};

function statusClass(s){
  if(s === '新案件') return 'new';
  if(s === '處理中') return 'working';
  if(s === '待員工回覆') return 'waiting';
  if(s === '已結案') return 'closed';
  return 'new';
}

function formatTime(v){
  if(!v) return '—';
  try {
    var d = new Date(v);
    if(isNaN(d.getTime())) return String(v);
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' +
      ('0'+d.getDate()).slice(-2) + ' ' +
      ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  } catch(e){ return String(v); }
}

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function dt(label, value, span){
  return '<dt>' + label + '</dt><dd class="' + (span ? 'span-two' : '') + '">' + escHtml(value || '—') + '</dd>';
}

function loadCase(){
  var token = sessionStorage.getItem('adminToken');
  if(!token){ window.location.href = BASE_URL + '?page=login'; return; }

  google.script.run
    .withSuccessHandler(function(result){
      if(!result.ok){
        if(result.error && result.error.indexOf('登入') >= 0){
          window.location.href = BASE_URL + '?page=login'; return;
        }
        document.getElementById('alertArea').innerHTML = '<div class="alert error">' + escHtml(result.error) + '</div>';
        return;
      }

      var c = result.case;
      var history = result.history || [];
      var kindLabel = KINDS[c.kind] || c.kind || '—';
      var sc = statusClass(c.status);
      var sensitive = c.sensitive === '1' || c.sensitive === 1;

      // Heading
      document.getElementById('pageTitle').textContent = c.title || '案件詳情';
      var metaHtml = '<span class="case-number">' + escHtml(c.caseNumber) + '</span>';
      metaHtml += ' <span class="status ' + sc + '"><span></span>' + escHtml(c.status) + '</span>';
      if(sensitive) metaHtml += ' <span class="manual-label">人工受理</span>';
      metaHtml += ' <span class="muted" style="font-size:11px;">' + kindLabel + '</span>';
      document.getElementById('headingMeta').innerHTML = metaHtml;

      // Details grid
      var gridHtml = '';
      gridHtml += dt('員工編號', c.employeeId);
      gridHtml += dt('姓名', c.name);
      gridHtml += dt('品牌／單位', c.organization);
      gridHtml += dt('類別', c.category);
      gridHtml += dt('服務類型', kindLabel);
      gridHtml += dt('負責人員', c.assignee || '（未指派）');
      gridHtml += dt('建立時間', formatTime(c.createdAt));
      gridHtml += dt('最後更新', formatTime(c.updatedAt));
      document.getElementById('detailsGrid').innerHTML = gridHtml;

      // Description
      document.getElementById('detailDesc').innerHTML = '<h3>案件說明</h3><p class="preserve-lines">' + escHtml(c.description || '') + '</p>';

      // Complaint extra fields
      var extraFields = [];
      if(c.eventTime) extraFields.push('<strong>事件時間：</strong>' + escHtml(c.eventTime));
      if(c.location) extraFields.push('<strong>發生地點：</strong>' + escHtml(c.location));
      if(c.people) extraFields.push('<strong>涉及人員：</strong>' + escHtml(c.people));
      if(c.evidence) extraFields.push('<strong>佐證：</strong>' + escHtml(c.evidence));
      if(c.evidenceNote) extraFields.push('<strong>佐證說明：</strong>' + escHtml(c.evidenceNote));
      if(extraFields.length > 0){
        var extraEl = document.getElementById('complaintExtra');
        extraEl.innerHTML = '<h3>申訴補充資訊</h3><p style="font-size:13px;line-height:2.2;">' + extraFields.join('<br>') + '</p>';
        extraEl.hidden = false;
      }

      // Pre-fill update form
      document.getElementById('updateStatus').value = c.status || '新案件';
      document.getElementById('updateAssignee').value = c.assignee || '';

      // Timeline
      var tlHtml = '';
      if(history.length === 0){
        tlHtml = '<li><div><div><strong>（尚無歷程記錄）</strong></div></div></li>';
      } else {
        history.forEach(function(h){
          tlHtml += '<li>';
          tlHtml += '<div><strong>' + escHtml(h.actor || 'HR') + '</strong><time>' + formatTime(h.createdAt) + '</time></div>';
          tlHtml += '<p>' + escHtml(h.action || '') + '</p>';
          if(h.note) tlHtml += '<div class="history-note">' + escHtml(h.note) + '</div>';
          tlHtml += '</li>';
        });
      }
      document.getElementById('timelineList').innerHTML = tlHtml;

      document.getElementById('detailLayout').hidden = false;
    })
    .withFailureHandler(function(err){
      document.getElementById('alertArea').innerHTML = '<div class="alert error">系統錯誤：' + err.message + '</div>';
    })
    .getCaseDetail(token, CASE_NUMBER);
}

function handleUpdate(){
  var token = sessionStorage.getItem('adminToken');
  if(!token){ window.location.href = BASE_URL + '?page=login'; return; }

  var updateAlertArea = document.getElementById('updateAlertArea');
  updateAlertArea.innerHTML = '';
  var btn = document.getElementById('updateBtn');
  btn.disabled = true;
  btn.innerHTML = '儲存中…';

  var updateData = {
    status: document.getElementById('updateStatus').value,
    assignee: document.getElementById('updateAssignee').value.trim(),
    category: document.getElementById('updateCategory').value || '',
    note: document.getElementById('updateNote').value.trim()
  };

  google.script.run
    .withSuccessHandler(function(result){
      btn.disabled = false;
      btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg> 儲存更新';
      if(result.ok){
        updateAlertArea.innerHTML = '<div class="alert success">已成功更新！</div>';
        document.getElementById('updateNote').value = '';
        loadCase(); // Reload to show updated data
      } else {
        updateAlertArea.innerHTML = '<div class="alert error">' + escHtml(result.error || '更新失敗') + '</div>';
      }
    })
    .withFailureHandler(function(err){
      btn.disabled = false;
      btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg> 儲存更新';
      updateAlertArea.innerHTML = '<div class="alert error">系統錯誤：' + err.message + '</div>';
    })
    .updateCase(token, CASE_NUMBER, updateData);
}

(function(){
  var token = sessionStorage.getItem('adminToken');
  if(!token){ window.location.href = BASE_URL + '?page=login'; return; }

  var urlParams = new URLSearchParams(location.search);
  CASE_NUMBER = urlParams.get('number') || '';
  if(!CASE_NUMBER){
    document.getElementById('alertArea').innerHTML = '<div class="alert error">未指定案件編號</div>';
    return;
  }

  loadCase();
})();
</script>
</body>
